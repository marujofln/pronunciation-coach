# Standalone development stack: the whole app + a fully auto-configured
# Authentik, no manual UI clicking or .env setup required.
#
# Usage:
#   echo "127.0.0.1 authentik-server" | sudo tee -a /etc/hosts   # one-time, see README
#   git switch dev
#   docker compose -f docker-compose.dev.yml up -d --build
#
# The app service builds the *working tree*, not a pinned ref, so whatever is
# checked out is what runs - including uncommitted edits, which is the point of
# a dev stack. Day-to-day work lands on the `dev` branch, so switch to it first;
# `master` only receives explicitly requested pushes.
#
# ALL secrets below are hardcoded, non-random, dev-only placeholders on
# purpose - this file is meant to be safe to commit and share. NEVER reuse
# any of these values for a real/shared/internet-facing deployment; use the
# regular docker-compose.yml + README's "Authentication setup" for that.
#
# This is a full duplicate of docker-compose.yml's services, not an override
# layer, and uses its own volume names so it never collides with data from
# the regular docker-compose.yml stack on the same machine. It also runs
# under its own Compose project name (below) - without this, both files
# default to the same project name (the directory name) and Compose treats
# them as the SAME project, so a `down` here would stop/remove the *other*
# file's same-named containers too.
name: pronunciation-coach-dev

x-dev-secrets:
  session_secret: &dev_session_secret dev-insecure-session-secret-do-not-use-in-production
  authentik_secret_key: &dev_authentik_secret_key dev-insecure-authentik-secret-key-do-not-use-in-production
  pg_password: &dev_pg_password dev-insecure-postgres-password
  app_pg_password: &dev_app_pg_password dev-insecure-app-postgres-password
  client_id: &dev_client_id dev-oauth-client-id
  client_secret: &dev_client_secret dev-oauth-client-secret

# Shared by the app and the migration runner: both need the same database, and
# Alembic's env.py imports app/config.py, so it needs the auth vars too.
x-app-env: &app-env
  SESSION_SECRET_KEY: *dev_session_secret
  AUTHENTIK_ISSUER: http://authentik-server:9000/application/o/pronunciation-coach/
  AUTHENTIK_CLIENT_ID: *dev_client_id
  AUTHENTIK_CLIENT_SECRET: *dev_client_secret
  POSTGRES_HOST: pronunciation-coach-db
  POSTGRES_PORT: "5432"
  POSTGRES_DB: pronunciation_coach
  POSTGRES_USER: pronunciation_coach
  POSTGRES_PASSWORD: *dev_app_pg_password

services:
  pronunciation-coach:
    # Working tree, so this is the `dev` branch's code when dev is checked out.
    build: .
    # Same tag on the app and the migration runner, so the image is built once
    # and the migration is the exact code the app then runs.
    image: pronunciation-coach-dev:local
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      <<: *app-env
      WHISPER_MODEL_SIZE: small.en
      WHISPER_COMPUTE_TYPE: int8
    depends_on:
      authentik-server:
        condition: service_started
      pronunciation-coach-db:
        condition: service_healthy
      pronunciation-coach-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- This app's own Postgres, separate from Authentik's (authentik-db below)
  # so wiping one doesn't take the other's data with it.
  pronunciation-coach-db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pronunciation_coach
      POSTGRES_USER: pronunciation_coach
      POSTGRES_PASSWORD: *dev_app_pg_password
    ports:
      # Published so a native `uv run fastapi dev` / `uv run alembic` can borrow
      # this database. 55432, not 5432, so it can't collide with a Postgres the
      # developer already runs on the host.
      - "55432:5432"
    volumes:
      - pronunciation-coach-db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # --- One-shot schema migration, run to completion before the app starts.
  pronunciation-coach-migrate:
    build: .
    image: pronunciation-coach-dev:local
    command: ["alembic", "upgrade", "head"]
    environment: *app-env
    depends_on:
      pronunciation-coach-db:
        condition: service_healthy
    # Quoted: a bare `no` is the YAML boolean false.
    restart: "no"

  authentik-db:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: authentik
      POSTGRES_USER: authentik
      POSTGRES_PASSWORD: *dev_pg_password
    volumes:
      - authentik-db-data-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  authentik-server:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.6}
    command: server
    restart: unless-stopped
    depends_on:
      authentik-db:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: *dev_authentik_secret_key
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: *dev_pg_password
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - authentik-media-dev:/data
      - ./authentik-blueprints:/blueprints/custom:ro
    shm_size: 512mb

  authentik-worker:
    image: ${AUTHENTIK_IMAGE:-ghcr.io/goauthentik/server}:${AUTHENTIK_TAG:-2026.5.6}
    command: worker
    restart: unless-stopped
    depends_on:
      authentik-db:
        condition: service_healthy
    environment:
      AUTHENTIK_SECRET_KEY: *dev_authentik_secret_key
      AUTHENTIK_POSTGRESQL__HOST: authentik-db
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: *dev_pg_password
      # Only read on first startup, against a fresh authentik-db-data-dev
      # volume - auto-creates the akadmin superuser, skipping the manual
      # /if/flow/initial-setup/ step.
      AUTHENTIK_BOOTSTRAP_PASSWORD: dev-insecure-akadmin-password
      AUTHENTIK_BOOTSTRAP_EMAIL: akadmin@localhost
      # Read by the blueprint in ./authentik-blueprints via !Env - must match
      # the pronunciation-coach service's own AUTHENTIK_CLIENT_ID/SECRET above.
      AUTHENTIK_CLIENT_ID: *dev_client_id
      AUTHENTIK_CLIENT_SECRET: *dev_client_secret
    volumes:
      - authentik-media-dev:/data
      - ./authentik-blueprints:/blueprints/custom:ro
    shm_size: 512mb

volumes:
  pronunciation-coach-db-data-dev:
  authentik-db-data-dev:
  authentik-media-dev:
