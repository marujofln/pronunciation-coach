services:
  pronunciation-coach:
    build: .
    # Run as the host user so files written into the bind-mounted data/ dir
    # (recordings, SQLite DB) aren't owned by root. Set HOST_UID/HOST_GID
    # before starting, e.g.: HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose up -d
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    ports:
      - "8000:8000"
    volumes:
      # Bind-mount the same data/ dir used by native (uv run) development,
      # so the SQLite DB, saved recordings, and downloaded model/nltk caches
      # persist across container rebuilds and are shared with local runs.
      - ./data:/app/data
    environment:
      WHISPER_MODEL_SIZE: small.en
      WHISPER_COMPUTE_TYPE: int8
    restart: unless-stopped
