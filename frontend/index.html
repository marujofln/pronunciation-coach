<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pronunciation Coach</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <h1>Pronunciation Coach</h1>
  <p class="subtitle">Practice your English pronunciation and get instant feedback.</p>
  <div class="user-menu" id="user-menu" hidden>
    <button id="user-menu-btn" type="button" class="icon-btn user-icon"
            aria-haspopup="menu" aria-expanded="false" aria-label="Account menu">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="8" r="3.75" />
        <path d="M4.5 20.25a7.5 7.5 0 0 1 15 0" />
      </svg>
    </button>
    <span class="user-tooltip" id="user-tooltip" role="tooltip"></span>
    <div class="user-dropdown" id="user-dropdown" role="menu" hidden>
      <p class="user-dropdown-email" id="user-dropdown-email"></p>
      <a class="user-dropdown-item" id="logout-link" href="/auth/logout" role="menuitem">Logout</a>
    </div>
  </div>
</header>

<main>
  <section class="card" id="phrase-card">
    <div class="phrase-controls">
      <label for="difficulty-select">Difficulty</label>
      <select id="difficulty-select">
        <option value="">Any</option>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <label for="category-select">Category</label>
      <select id="category-select">
        <option value="">Any</option>
      </select>
      <button id="new-phrase-btn" type="button">New phrase</button>
    </div>

    <div id="phrase-display">
      <div class="phrase-row">
        <p class="phrase-text" id="phrase-text">Loading a phrase…</p>
        <button id="speak-btn" type="button" class="icon-btn" disabled
                aria-label="Listen to the phrase" title="Listen to the phrase">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 9.5h3.5L12 5.5v13L7.5 14.5H4z" />
            <path d="M16 8.5a5 5 0 0 1 0 7" />
            <path d="M18.5 6a8.5 8.5 0 0 1 0 12" />
          </svg>
        </button>
      </div>
      <div class="badges">
        <span class="badge" id="phrase-difficulty"></span>
        <span class="badge" id="phrase-category"></span>
      </div>
    </div>

    <div class="record-controls">
      <button id="record-btn" type="button">● Record</button>
      <audio id="preview" controls></audio>
      <button id="submit-btn" type="button" disabled>Submit</button>
    </div>
    <p id="status-line" class="status-line"></p>
  </section>

  <section class="card" id="results-card" hidden>
    <h2>Result</h2>
    <p class="overall-score">Score: <span id="overall-score">–</span></p>
    <p class="feedback-words" id="feedback-words"></p>
    <p class="transcript">You said: “<span id="transcript-text"></span>”</p>
  </section>

  <section class="card" id="stats-card">
    <h2>Your progress</h2>
    <p id="stats-summary">No attempts yet.</p>
  </section>

  <section class="card" id="history-card">
    <h2>Recent attempts</h2>
    <ul id="history-list"></ul>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
