# Declarative Authentik config for local development, applied automatically
# on startup (see docker-compose.dev.yml, which mounts this directory into
# /blueprints/custom on the Authentik server/worker containers). Creates the
# OAuth2/OIDC Provider + Application this app authenticates against, so no
# manual "click through the UI" step is needed for a dev stack.
#
# client_id/client_secret come from the AUTHENTIK_CLIENT_ID/AUTHENTIK_CLIENT_SECRET
# env vars (see docker-compose.dev.yml's anchors) - the same fixed dev-only
# values are also handed to the pronunciation-coach service itself.
version: 1
metadata:
  name: pronunciation-coach-dev
entries:
  - model: authentik_providers_oauth2.oauth2provider
    id: pronunciation-coach-provider
    identifiers:
      name: pronunciation-coach
    state: present
    attrs:
      name: pronunciation-coach
      client_type: confidential
      # Without this, Authentik rejects every /application/o/authorize/
      # request with "Invalid grant_type for provider" - the field defaults
      # to empty, it's not implied by client_type.
      grant_types:
        - authorization_code
      client_id: !Env AUTHENTIK_CLIENT_ID
      client_secret: !Env AUTHENTIK_CLIENT_SECRET
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      # default-invalidation-flow, NOT default-provider-invalidation-flow: the
      # latter ships with no stages bound to it, so it ends only the per-app
      # session and leaves the Authentik session itself alive. Logging out then
      # bounces straight back through /auth/login, silently re-authorized, and
      # Logout looks like it does nothing.
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-invalidation-flow]]
      redirect_uris:
        - url: http://localhost:8000/auth/callback
          matching_mode: strict
        # post_logout_redirect_uri for RP-initiated logout is validated against
        # this same list, so the app's home URL has to be allowed here too.
        - url: http://localhost:8000/
          matching_mode: strict
      # Matches exactly the scopes app/auth.py requests
      # (client_kwargs={"scope": "openid profile email"}) - no offline_access,
      # since this app never uses refresh tokens.
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, email]]
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
  - model: authentik_core.application
    id: pronunciation-coach-application
    identifiers:
      slug: pronunciation-coach
    state: present
    attrs:
      name: Pronunciation Coach
      slug: pronunciation-coach
      provider: !Find [authentik_providers_oauth2.oauth2provider, [name, pronunciation-coach]]
      policy_engine_mode: any
