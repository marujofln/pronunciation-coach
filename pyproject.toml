[project]
name = "pronunciation-coach"
version = "0.1.0"
description = "Local web app for practicing English pronunciation with Whisper-based phoneme scoring"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.140.13",
    "faster-whisper>=1.2.1",
    "g2p-en>=2.1.0",
    "nltk<3.9",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.fastapi]
entrypoint = "app.main:app"
