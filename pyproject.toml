[project]
name = "pronunciation-coach"
version = "0.2.0"
description = "Local web app for practicing English pronunciation with Whisper-based phoneme scoring"
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "fastapi[standard]>=0.140.13",
    "faster-whisper>=1.2.1",
    "g2p-en>=2.1.0",
    "nltk<3.9",
    "psycopg[binary]>=3.3.4",
    "sqlmodel>=0.0.39",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-playwright>=0.7.1",
    "ruff>=0.16.0",
    "testcontainers[postgres]>=4.15.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
markers = [
    "frontend: browser-driven frontend tests (need `playwright install chromium`)",
]
