# Alembic configuration. Lives at the repo root so `uv run alembic upgrade head`
# works with no -c flag, and so prepend_sys_path resolves to the repo root,
# which is what lets env.py `import app`.

[alembic]
# %(here)s is this file's own directory, so the CLI (from any cwd) and the test
# suite (which drives Alembic in-process via alembic.config.Config) resolve the
# same scripts directory.
script_location = %(here)s/app/alembic

# Date-prefixed filenames, so `ls versions/` reads chronologically — the
# revision hash on its own tells you nothing at a glance.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

prepend_sys_path = .
path_separator = os

# Deliberately no sqlalchemy.url: env.py takes the URL from app/config.py, so
# exactly one thing in the repo knows how to build it and no database password
# ever lands in a committed file.

# Lint and format each newly generated revision, so `ruff check .` stays clean
# without a per-file ignore. Autogenerate appends its own imports after the
# template's fixed block (leaving them unsorted) and emits `import sqlmodel`
# whether or not the revision has a str column to use it on; --fix settles both.
# These run on `alembic revision` only, never on `upgrade`, so the Docker image
# (built --no-dev, no ruff) never needs them.
[post_write_hooks]
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging configuration, consumed by env.py's fileConfig().
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
